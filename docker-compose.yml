services:
  kuma:
    # Pinned on purpose: the `latest` tag is deprecated and points at v1.
    # The `-slim` variant is ~177 MB vs ~590 MB for the full image.
    image: louislam/uptime-kuma:2.5.11-slim
    container_name: kuma
    ports:
      # Kuma listens on 3001 inside the container. The host port is
      # published as 3002 so it does not collide with other stacks on the
      # same machine — pick whatever is free on your host.
      - "3002:3001"
    volumes:
      # Persistent state (kuma.db + uploads) lives on a separate volume,
      # not on the root filesystem, so the state survives a rebuild.
      - ./data:/app/data
    # Run as the host user so the bind-mounted files are owned by that
    # user and no root-owned leftovers need cleaning up later.
    user: "1000:1000"
    # Cap the memory so the instance can never starve the other workloads
    # on the same host.
    mem_limit: 512m
    restart: unless-stopped
